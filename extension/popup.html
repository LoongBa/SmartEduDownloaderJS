<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 260px;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f7fa;
      color: #333;
    }
    .header {
      background: #1976d2;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header img { width: 20px; height: 20px; }
    .header .title { font-size: 14px; font-weight: bold; }
    .header .sub { font-size: 10px; opacity: .8; margin-top: 2px; }
    .menu { padding: 6px 0; }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      cursor: pointer;
      text-decoration: none;
      color: #333;
      font-size: 13px;
      transition: background .12s ease;
    }
    .menu-item:hover { background: #e3f2fd; }
    .menu-item .icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .menu-item .label { flex: 1; }
    .menu-item .badge {
      font-size: 10px;
      color: #999;
      flex-shrink: 0;
    }
    .divider { height: 1px; background: #e5e7eb; margin: 4px 0; }
    .footer {
      padding: 8px 16px;
      font-size: 11px;
      color: #999;
      background: #fff;
      border-top: 1px solid #eee;
      text-align: center;
    }
    .download-view { padding: 16px; text-align: center; }
    .download-view .book { font-size: 13px; color: #555; margin-bottom: 12px; word-break: break-all; }
    .download-view .btn {
      display: block;
      background: #4caf50;
      color: #fff;
      text-decoration: none;
      padding: 10px 0;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .download-view .btn:hover { background: #43a047; }
    .download-view .more {
      display: block;
      margin-top: 10px;
      color: #1976d2;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }
    .status {
      padding: 8px 16px;
      font-size: 12px;
      color: #666;
      background: #fff8e1;
      border-bottom: 1px solid #ffe082;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="logo">
    <div>
      <div class="title">中小学教材免费下载</div>
      <div class="sub">国家智慧教育平台教材下载</div>
    </div>
  </div>

  <div id="content"></div>

  <script src="popup.js"></script>
</body>
</html>
